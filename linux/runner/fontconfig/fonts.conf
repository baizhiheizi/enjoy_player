<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Loaded through FONTCONFIG_FILE by main.cc (ADR-0095). Flutter's Linux engine
  resolves CJK glyphs through fontconfig's per-character fallback, which ranks
  by weight; at weight 600 the only exact CJK face is usually Noto Serif CJK
  SemiBold, so Geist labels rendered serif Chinese. Appending the CJK sans
  families as strong matches keeps that fallback sans at every weight.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
    </edit>
  </match>
</fontconfig>
