name: Setup Android SDK
description: >-
  Install Android cmdline-tools and the requested SDK packages with retries.
  android-actions/setup-android fails the job outright when the flaky
  self-hosted network cannot fetch the dl.google.com package manifests
  ("IO exception while downloading manifest" → "Failed to find package"),
  which is transient: the same runner succeeds on the next run. This wrapper
  tolerates the bootstrap failure and retries the package install with
  backoff; once the packages persist on the runner's local disk, later runs
  skip the network entirely.

  Since 2026-09 the dl.google.com dependency is inverted for the GFW'd runner
  network (dl.google.com is TLS-reset on a DIRECT route): sdkmanager package
  downloads (manifests, components, licenses) go to the Tencent Android SDK
  mirror via SDK_TEST_BASE_URL (classic sdkmanager honors it), and a missing
  sdkmanager is bootstrapped from the mirror zip first. android-actions/setup-android
  is demoted to last-resort fallback for networks where the mirror is
  unreachable but Google is not blocked.

  Ordering matters when the runners sit behind a proxy that un-blocks
  dl.google.com (clash et al): android-actions/setup-android downloads its
  cmdline-tools zip from dl.google.com directly, so running it before the
  mirror path lets the "fallback" succeed through the proxy and silently burn
  proxy quota — observed as GB of dl.google.com egress with zero bytes from
  the mirror. The mirror bootstrap therefore runs FIRST and android-actions
  only runs when it fails.

inputs:
  packages:
    description: >-
      SDK packages to install, e.g. "platforms;android-36 build-tools;36.0.0"
      (same package ids sdkmanager takes, separated by whitespace).
    required: true
  cmdline-tools-version:
    description: cmdline-tools version (build number) for the bootstrap; the mirror zip is commandlinetools-linux-<version>_latest.zip.
    required: false
    default: "12266719"
  attempts:
    description: sdkmanager install attempts before the step fails.
    required: false
    default: "5"
  sdk_mirror_base_url:
    description: >-
      Base URL of an Android SDK repository mirror, used for SDK_TEST_BASE_URL
      and the cmdline-tools bootstrap zip. A non-empty SDK_TEST_BASE_URL in the
      environment wins over this input.
    required: false
    default: "https://mirrors.cloud.tencent.com/AndroidSDK/"

runs:
  using: composite
  steps:
    - name: Locate existing sdkmanager
      id: probe
      shell: bash
      run: |
        set -euo pipefail
        sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
        echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
        found="false"
        for cand in "$sdk/cmdline-tools/latest/bin/sdkmanager" \
          "$sdk"/cmdline-tools/*/bin/sdkmanager; do
          if [ -x "$cand" ]; then found="true"; break; fi
        done
        echo "found=$found" >> "$GITHUB_OUTPUT"

    # Primary bootstrap: the mirror zip — same bytes Google publishes
    # (unzip's CRCs are the integrity check) — unpacked to the versioned dir,
    # matching setup-android's layout. Runs BEFORE android-actions so a proxy
    # that un-blocks dl.google.com cannot make the Google path win by default.
    # Every failure is tolerated: partial extractions are removed so the
    # probe's cmdline-tools/*/bin/sdkmanager glob cannot pass a half-unpacked
    # dir off as a warm SDK on a later run, and a rename that lost a race
    # with a concurrent bootstrap on the shared per-host SDK volume reuses
    # that install instead of falling back to dl.google.com.
    - name: Bootstrap cmdline-tools (mirror zip)
      id: mirror-bootstrap
      if: steps.probe.outputs.found != 'true'
      shell: bash
      env:
        SDK_TEST_BASE_URL: ${{ env.SDK_TEST_BASE_URL || inputs.sdk_mirror_base_url }}
        CMDLINE_TOOLS_VERSION: ${{ inputs.cmdline-tools-version }}
      run: |
        set -euo pipefail
        sdk="${{ steps.probe.outputs.sdk }}"
        version="${CMDLINE_TOOLS_VERSION}"
        base="${SDK_TEST_BASE_URL%/}"
        zip_url="${base}/commandlinetools-linux-${version}_latest.zip"
        archive="${RUNNER_TEMP:-/tmp}/commandlinetools-linux-${version}_latest.zip"
        wrapper_dir="$sdk/cmdline-tools/cmdline-tools"
        versioned_dir="$sdk/cmdline-tools/$version"
        echo "setup-android: no sdkmanager found — bootstrapping cmdline-tools $version from $zip_url"
        if ! curl -fsSL --http1.1 --retry 5 --retry-delay 10 --connect-timeout 20 \
            -o "$archive" "$zip_url"; then
          echo "::warning::mirror cmdline-tools download failed ($zip_url) — falling back to android-actions/setup-android (dl.google.com)"
          echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The zip ships a top-level cmdline-tools/ wrapper dir. A stale one
        # from an aborted attempt would make unzip merge into it and mv nest
        # instead of rename, so it is cleared alongside the versioned dir
        # before unpacking.
        if ! mkdir -p "$sdk/cmdline-tools" \
           || ! rm -rf "$versioned_dir" "$wrapper_dir" \
           || ! unzip -q "$archive" -d "$sdk/cmdline-tools" \
           || ! mv -T "$wrapper_dir" "$versioned_dir"; then
          if [ -x "$versioned_dir/bin/sdkmanager" ]; then
            echo "::warning::mirror cmdline-tools: concurrent bootstrap already installed $versioned_dir — reusing it"
            rm -f "$archive" || true
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf "$versioned_dir" "$wrapper_dir" || true
          echo "::warning::mirror cmdline-tools unpack failed — falling back to android-actions/setup-android (dl.google.com)"
          echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        rm -f "$archive" || true
        echo "bootstrapped=true" >> "$GITHUB_OUTPUT"

    # Last resort only: runs when the mirror bootstrap above failed, for
    # networks where the mirror is blocked but Google is reachable (directly
    # or via an un-blocking proxy). Its cmdline-tools download targets
    # dl.google.com, so on the GFW'd DIRECT network this fails fast and is
    # tolerated; the install step below then reports the combined failure.
    - name: Bootstrap SDK (android-actions fallback; dl.google.com)
      if: steps.probe.outputs.found != 'true' && steps.mirror-bootstrap.outputs.bootstrapped != 'true'
      uses: android-actions/setup-android@v3
      continue-on-error: true
      env:
        SDK_TEST_BASE_URL: ${{ env.SDK_TEST_BASE_URL || inputs.sdk_mirror_base_url }}
      with:
        packages: ${{ inputs.packages }}
        cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: true

    - name: Install SDK packages (mirror-backed, retry on transient failures)
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail

        # Mirror: env wins, input provides the default. Classic sdkmanager
        # honors SDK_TEST_BASE_URL for the repository manifest, component
        # downloads, and license acceptance — this is what keeps
        # dl.google.com (TLS-reset on this network) out of the critical path.
        export SDK_TEST_BASE_URL="${SDK_TEST_BASE_URL:-${{ inputs.sdk_mirror_base_url }}}"

        # The bootstrap step exports ANDROID_HOME only when it fully succeeds;
        # fall back to its documented default location so a flaky bootstrap
        # that still installed cmdline-tools does not strand us.
        sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
        echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
        echo "setup-android: SDK_TEST_BASE_URL=$SDK_TEST_BASE_URL"

        find_sdkmanager() {
          for cand in "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$cand" ]; then printf '%s' "$cand"; return 0; fi
          done
          return 1
        }

        sdkmanager_bin="$(find_sdkmanager || true)"

        # No usable sdkmanager: both the mirror bootstrap and the
        # android-actions fallback failed.
        if [ -z "$sdkmanager_bin" ]; then
          echo "::error::sdkmanager not found under $sdk/cmdline-tools — the mirror bootstrap and the android-actions fallback both failed"
          exit 1
        fi

        # Package id → directory: "platforms;android-36" is installed at
        # "$sdk/platforms/android-36", "build-tools;36.0.0" likewise.
        missing=()
        for pkg in $PACKAGES; do
          dir="$sdk/$(printf '%s' "$pkg" | tr ';' '/')"
          if [ -d "$dir" ]; then
            echo "SDK package present: $pkg"
          else
            missing+=("$pkg")
          fi
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "setup-android: all requested SDK packages already installed."
          exit 0
        fi
        echo "setup-android: installing missing SDK packages: ${missing[*]}"

        max="${ATTEMPTS:-5}"
        for attempt in $(seq 1 "$max"); do
          # License acceptance needs the remote manifest too, so only run it
          # when no accepted licenses are on disk yet. sdkmanager inherits
          # SDK_TEST_BASE_URL, so this reads the mirror as well.
          if [ ! -d "$sdk/licenses" ] || [ -z "$(ls -A "$sdk/licenses" 2>/dev/null)" ]; then
            yes | "$sdkmanager_bin" --licenses >/dev/null || true
          fi
          if "$sdkmanager_bin" --install "${missing[@]}"; then
            echo "setup-android: SDK packages installed (attempt $attempt/$max)."
            exit 0
          fi
          echo "::warning::sdkmanager install failed (attempt $attempt/$max) — retrying in $((attempt * 15))s"
          sleep "$((attempt * 15))"
        done

        echo "::error::sdkmanager could not install ${missing[*]} after $max attempts"
        exit 1
