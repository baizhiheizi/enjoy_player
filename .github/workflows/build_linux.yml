name: Build Linux

on:
  pull_request:
    paths: &build_linux_paths
      - "lib/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "linux/**"
      - "mise.toml"
      - ".github/actions/setup-flutter/**"
      - ".github/scripts/ensure_linux_tooling.sh"
      - ".github/workflows/build_linux.yml"
  push:
    branches: [main, master]
    paths: *build_linux_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cache misses must not reach pub.dev / storage.googleapis.com through the
# per-GB proxy; these mirrors are routed DIRECT. pubspec.lock pins every
# package by sha256, so a mirror serving different bytes fails the hash check.
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

permissions:
  contents: read

jobs:
  build-linux:
    # PR runs pause in ci-approval until a required reviewer approves; push and
    # workflow_dispatch resolve to the unprotected ci-direct and run freely.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'ci-approval' || 'ci-direct' }}
    runs-on: [self-hosted, Linux, ci]
    steps:
      - uses: actions/checkout@v6

      # The job's inner environment is reset to a pristine state before each
      # run, so ~/.pub-cache cannot persist on the runner between jobs. The
      # cache backend is the LAN gh-sr-cache server: a hit costs zero proxy
      # bytes, and only a miss re-uploads. The Flutter engine artifacts this
      # build also needs live inside the SDK install, which does persist.
      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Save pub cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Ensure Linux tooling
        run: bash .github/scripts/ensure_linux_tooling.sh

      - uses: ./.github/actions/setup-flutter

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build linux (debug)
        run: flutter build linux --debug

      - name: Flutter build linux (release)
        run: flutter build linux --release

      - name: Upload debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enjoy-player-linux-debug-${{ github.sha }}
          path: build/linux/x64/debug/bundle
          retention-days: 1
