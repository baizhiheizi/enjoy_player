name: Build Apple (iOS + macOS)

on:
  pull_request:
    paths: &build_apple_paths
      - "lib/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "ios/**"
      - "macos/**"
      - "mise.toml"
      - ".github/actions/setup-flutter/**"
      - ".github/actions/setup-macos-runner-env/**"
      - ".github/scripts/ensure_ios_ci_toolchain.sh"
      - ".github/scripts/apple_spm_hygiene.sh"
      - ".github/scripts/build_ios_ci.sh"
      - ".github/scripts/build_macos_ci.sh"
      - ".github/scripts/check_bundled_espeak_data.sh"
      - ".github/workflows/build_apple.yml"
  push:
    branches: main
    paths: *build_apple_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cache misses must not reach pub.dev / storage.googleapis.com through the
# per-GB proxy; these mirrors are routed DIRECT. pubspec.lock pins every
# package by sha256, so a mirror serving different bytes fails the hash check.
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

permissions:
  contents: read

jobs:
  ios:
    name: iOS smoke
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      # The job's environment is reset to a pristine state before each run, so
      # ~/.pub-cache cannot persist on the runner between jobs. The cache
      # backend is the LAN gh-sr-cache server: a hit costs zero proxy bytes,
      # and only a miss re-uploads.
      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Save pub cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      # `pod install` is the other per-run network cost on this runner (the
      # spec repo plus every pod source archive). Keyed per job so the iOS and
      # macOS locks cannot contend for one key, and on the lock file so a pod
      # version bump re-resolves rather than serving a stale tree.
      - name: Restore CocoaPods caches (iOS)
        id: pods-cache-ios
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-ios-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-ios-

      - name: Save CocoaPods caches (iOS)
        if: steps.pods-cache-ios.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ steps.pods-cache-ios.outputs.cache-primary-key }}

      - uses: ./.github/actions/setup-macos-runner-env

      - uses: ./.github/actions/setup-flutter

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install (iOS)
        run: cd ios && pod install

      - name: Ensure iOS Xcode components
        run: bash .github/scripts/ensure_ios_ci_toolchain.sh

      - name: Flutter build ios (debug, compile-only)
        run: bash .github/scripts/build_ios_ci.sh Debug

      - name: Flutter build ios (release, compile-only)
        run: bash .github/scripts/build_ios_ci.sh Release

      - name: Assert eSpeak data in iOS Runner.app
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r app; do
            bash .github/scripts/check_bundled_espeak_data.sh \
              "${app}/espeak-ng-data" \
              "${app}/Frameworks/eSpeakNG.framework/eSpeakNG"
            found=1
          done < <(find build/ios/DerivedData/Build/Products -name Runner.app -type d)
          test "$found" -eq 1

  macos:
    name: macOS smoke
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Save pub cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Restore CocoaPods caches (macOS)
        id: pods-cache-macos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-macos-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-macos-

      - name: Save CocoaPods caches (macOS)
        if: steps.pods-cache-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ steps.pods-cache-macos.outputs.cache-primary-key }}

      - uses: ./.github/actions/setup-macos-runner-env

      - uses: ./.github/actions/setup-flutter

      - name: Install Homebrew deps (FFmpeg kit)
        run: brew bundle install --file=macos/Brewfile

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install (macOS)
        run: cd macos && pod install

      - name: Flutter build macos (debug)
        run: bash .github/scripts/build_macos_ci.sh Debug

      - name: Flutter build macos (release, compile-only)
        run: bash .github/scripts/build_macos_ci.sh Release

      - name: Assert eSpeak data in macOS app bundle
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r app; do
            bash .github/scripts/check_bundled_espeak_data.sh \
              "${app}/Contents/Resources/espeak-ng-data" \
              "${app}/Contents/Frameworks/libespeak-ng.dylib"
            found=1
          done < <(find build/macos/Build/Products -name 'Enjoy Player.app' -type d)
          test "$found" -eq 1
