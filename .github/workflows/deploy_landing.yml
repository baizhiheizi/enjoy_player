name: Deploy landing page

on:
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/deploy_landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/deploy_landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A secret that carries stray characters (whitespace, quotes, a
      # non-ASCII byte) makes Cloudflare reject the Authorization header with
      # "Invalid format for Authorization header" (code 6111) rather than an
      # auth error. A Cloudflare API token only ever contains [A-Za-z0-9_-],
      # so the value is reduced to that alphabet.
      - name: Sanitize the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -cd 'A-Za-z0-9_-')"
          echo "::add-mask::${token}"
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"
          if [[ -z "${token}" ]]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret holds no [A-Za-z0-9_-] characters, so it is not a Cloudflare API token. Replace it with a token created at https://dash.cloudflare.com/profile/api-tokens (Cloudflare Pages: Edit + Account Settings: Read) and set it as the repository secret." >&2
            exit 1
          fi
          echo "Cloudflare token length: ${#token}"
          if [[ ${#token} -lt 30 ]]; then
            echo "::warning::The CLOUDFLARE_API_TOKEN secret is only ${#token} characters; Cloudflare API tokens are ~40. It may be truncated." >&2
          fi

      # Production: the main branch deployment is what player.enjoy.bot serves.
      # Pages resolves wrangler.toml from the working directory and rejects a
      # custom --config path, so the deploy runs inside landing/.
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name enjoy-player-landing \
            --branch main

      # Preview: a branch deployment, commented on the PR so a reviewer can
      # open the exact build instead of guessing from the local preview server.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        working-directory: landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name enjoy-player-landing \
            --branch "pr-${PR_NUMBER}"
          url="https://pr-${PR_NUMBER}-enjoy-player-landing.pages.dev"
          echo "PREVIEW_URL=${url}" >> "$GITHUB_ENV"

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          {
            echo "### Landing page preview"
            echo
            echo "\`${PREVIEW_URL}\` — \`/api/latest\` proxies the live release manifest from this preview."
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${PR_NUMBER}" --body \
            "Landing page preview: ${PREVIEW_URL} (its \`/api/latest\` proxies the live release manifest)."
