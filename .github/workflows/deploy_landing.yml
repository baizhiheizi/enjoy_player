name: Deploy landing page

on:
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/deploy_landing.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/deploy_landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A secret set with a trailing newline makes Cloudflare reject the
      # Authorization header ("Invalid format for Authorization header"), so
      # the token is trimmed before it is used.
      - name: Trim the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="${CLOUDFLARE_API_TOKEN//$'\r'/}"
          token="${token//$'\n'/}"
          token="${token#"${token%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"
          echo "::add-mask::${token}"
          echo "CLOUDFLARE_API_TOKEN=${token}" >> "$GITHUB_ENV"

      # Production: the main branch deployment is what player.enjoy.bot serves.
      # Pages resolves wrangler.toml from the working directory and rejects a
      # custom --config path, so the deploy runs inside landing/.
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name enjoy-player-landing \
            --branch main

      # Preview: a branch deployment, commented on the PR so a reviewer can
      # open the exact build instead of guessing from the local preview server.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        working-directory: landing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name enjoy-player-landing \
            --branch "pr-${PR_NUMBER}"
          url="https://pr-${PR_NUMBER}-enjoy-player-landing.pages.dev"
          echo "PREVIEW_URL=${url}" >> "$GITHUB_ENV"

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          {
            echo "### Landing page preview"
            echo
            echo "\`${PREVIEW_URL}\` — \`/api/latest\` proxies the live release manifest from this preview."
          } >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${PR_NUMBER}" --body \
            "Landing page preview: ${PREVIEW_URL} (its \`/api/latest\` proxies the live release manifest)."
