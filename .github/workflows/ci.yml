name: CI

on:
  pull_request:
  push:
    branches: main
    paths:
      - "lib/**"
      - "test/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "mise.toml"
      - ".github/scripts/ensure_linux_tooling.sh"
      - ".github/scripts/check_no_new_path_deps.sh"
      - ".github/scripts/check_dart_format.sh"
      - ".github/scripts/check_coverage_gate.sh"
      - ".github/scripts/merge_shard_lcov.sh"
      - ".github/scripts/split_test_shards.sh"
      - ".github/scripts/test_git_hooks.sh"
      - ".github/scripts/validate_ci_gates.sh"
      - ".githooks/**"
      - "tool/prefetch_sqlite3_libs.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release_publish.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner pool sits behind a per-GB proxy, so a cache miss must not fall
# back to pub.dev / storage.googleapis.com. These community mirrors are routed
# DIRECT by the local OpenClash rules. pubspec.lock pins every package by
# sha256, so a mirror that served different bytes would fail the hash check
# rather than install a different package.
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

permissions:
  contents: read

jobs:
  # Required status checks must always report, so this workflow triggers on
  # every PR and this job decides whether the real job has work to do. A
  # skipped job counts as passing; an API error counts as relevant (fail-safe:
  # never skip silently). Push events keep their trigger-level path filter.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # Prefix branches (lib/, test/, packages/, .githooks/) are left
          # unanchored at the end on purpose: only the fully-named file
          # branches carry $. Wrapping the whole group in ^(...)$ would make
          # every prefix branch match just its literal directory name.
          # .github/scripts/test_git_hooks.sh pins this behavior.
          PATTERN: '^(lib/|test/|packages/|\.githooks/|tool/prefetch_sqlite3_libs\.sh$|pubspec\.(yaml|lock)$|analysis_options\.yaml$|mise\.toml$|\.github/scripts/(ensure_linux_tooling|check_no_new_path_deps|check_dart_format|check_coverage_gate|merge_shard_lcov|split_test_shards|test_git_hooks|validate_ci_gates)\.sh$|\.github/workflows/(ci|release_publish)\.yml$)'
        run: |
          if ! files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"; then
            echo "::warning::Could not list PR files; running the checks."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq "$PATTERN" <<<"$files"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No matching paths changed; the check will be skipped."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Format/analyze/hook gates first, alone: the test shards below repeat the
  # Flutter setup but not these, and a format or analyze failure skips the
  # shards instead of burning ten minutes of runner time to rediscover it.
  analyze:
    name: Analyze
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    # The environment (and with it the ci-approval reviewer gate for PRs from
    # outside the org) lives only here. The test, path-package and gates jobs
    # `need:` this one, so nothing self-hosted executes until this job — and
    # therefore the approval — has cleared; carrying the environment on every
    # job would instead ask for one approval per matrix leg.
    environment:
      name: ${{ github.event_name == 'pull_request' && !contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association) && 'ci-approval' || 'ci-direct' }}
    runs-on: [self-hosted, Linux, ci]
    # The job's fast path is ~2 minutes, but it gates every test job: a cold
    # pub cache (1.3 GB over the LAN cache or the proxy) or a host busy with
    # another PR's shards can stretch setup, and a timeout here would skip
    # the whole matrix with zero test signal. 40 min keeps the old single
    # job's headroom; the aggregate still reports which leg actually hung.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      # gh-sr resets the job's inner environment to a pristine state before
      # every run (only the image cache survives), so ~/.pub-cache cannot be
      # left on the runner's disk between jobs the way the Flutter SDK is.
      # Restore it from the Actions cache instead; the cache backend is the
      # LAN `gh-sr-cache` server, so a hit costs zero proxy bytes.
      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # Re-uploading ~1.3 GB on every exact hit would defeat the point, so only
      # a miss (or a prefix-restore that filled in new packages) writes back.
      # The shard matrix races this step with an identical key on a cold cache;
      # the cache API lets exactly one writer win, so a lost race must not red
      # the leg — the winner's entry serves every later run.
      - name: Save pub cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Ensure Linux tooling
        run: bash .github/scripts/ensure_linux_tooling.sh --skip-wpe

      # mise pilot: install the Flutter pinned in the repo-root mise.toml
      # (single source of truth for local dev and CI). Installs persist in
      # ~/.local/share/mise across runs on this self-hosted runner, so the
      # archive is fetched once per version bump — same property the
      # setup-flutter action provides for the other workflows. mise-action is
      # pinned by commit; `version` pins mise itself (matching the version
      # preinstalled on the runner pool, so no self-update round-trip), and
      # github_token keeps that self-update path working on the rare runs
      # where the pool's mise has drifted.
      - name: Setup Flutter (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          # The mise installs survive in the preserved image cache, so caching
          # the SDK itself would only add a dependency on the cache service
          # for an archive this pool already fetches once per version bump.
          # The package cache restored above is a different story — it does
          # not survive the per-job environment reset.
          cache: false

      # Keep this executable probe: it warms Flutter's lazy bootstrap cache
      # before any read-only-mount window (see the note in
      # .github/actions/setup-flutter/action.yml and #501).
      - name: Flutter version probe
        run: flutter --version

      - name: Flutter pub get
        run: |
          if ! flutter pub get; then
            echo "::warning::Mirror dependency resolution failed; retrying with pub.dev."
            echo "PUB_HOSTED_URL=https://pub.dev" >> "$GITHUB_ENV"
            PUB_HOSTED_URL=https://pub.dev flutter pub get
          fi

      - name: Forbid new local-path packages
        run: bash .github/scripts/check_no_new_path_deps.sh

      - name: Git hook regression suite
        run: bash .github/scripts/test_git_hooks.sh

      - name: Dart format
        run: bash .github/scripts/check_dart_format.sh

      - name: Flutter analyze
        run: flutter analyze

  # The app suite split across four shards. Two reasons, both measured on the
  # shared pool (2026-11-13, x1 — two `ci` runners, both on one 24-core host):
  #
  # 1. Collision safety. Two overlapping PR runs each launched flutter test at
  #    the default concurrency (cores/2 = 12), and 24 flutter_tester processes
  #    plus two frontend servers drove the host into swap — the suite doubled
  #    from 13 to 28.5 minutes and two Drift-backed tests failed on timing.
  #    --concurrency=6 caps every leg at 6 tester processes, so even a
  #    two-PR collision stays at the 12-process load a solo run already
  #    sustains. It also keeps tests honest on a loaded machine instead of
  #    masking the slowdown behind --timeout.
  # 2. Failure isolation. fail-fast: false plus a per-shard job means one
  #    flaky shard reports red while the other three still report results, and
  #    the gates job below still runs the coverage baseline — under the old
  #    single job, one timed-out test silently skipped the calendar-label,
  #    coverage-gate, codecov and path-package steps behind it.
  #
  # The shards are explicit disjoint file lists (split_test_shards.sh), not
  # flutter test's --total-shards: that flag slices by case inside every file,
  # which still makes each shard compile the whole suite. With the file
  # partition each shard compiles and runs only its quarter.
  #
  # Two shards per wave land on the pool's single host; scaling gh-sr to two
  # instances per host across a second host drops the whole matrix into one
  # wave at the same 12-lane-per-host budget (see ADR-0105).
  test:
    name: Test (shard ${{ matrix.shard-index }}/4)
    needs: [changes, analyze]
    if: ${{ !cancelled() && needs.analyze.result == 'success' && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    runs-on: [self-hosted, Linux, ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # See the analyze job: the four legs race the same key on a cold cache
      # and exactly one save wins, so losing the race is not a failure.
      - name: Save pub cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Ensure Linux tooling
        run: bash .github/scripts/ensure_linux_tooling.sh --skip-wpe

      - name: Setup Flutter (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          cache: false

      - name: Flutter version probe
        run: flutter --version

      - name: Flutter pub get
        run: |
          if ! flutter pub get; then
            echo "::warning::Mirror dependency resolution failed; retrying with pub.dev."
            echo "PUB_HOSTED_URL=https://pub.dev" >> "$GITHUB_ENV"
            PUB_HOSTED_URL=https://pub.dev flutter pub get
          fi

      # package:sqlite3 3.x downloads its prebuilt library from
      # github.com/simolus3/sqlite3.dart/releases with Dart HttpClient (no
      # retries), so a dropped TLS handshake fails the whole test run with
      # "Building native assets failed". Prefetch into the dart_build shared
      # cache with curl (which retries) so the hook reuses it. The Apple and
      # Android paths prefetch the same way.
      - name: Prefetch sqlite3 Linux native libs
        env:
          # The prefetch falls back to the GitHub API asset endpoint when the
          # release download URL fails; a token lifts its rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash tool/prefetch_sqlite3_libs.sh linux \
            || echo "::warning::prefetch_sqlite3_libs skipped; the dart_build hook will fetch on its own"

      # --timeout 5m stays the stall-detection budget for the whole suite (a
      # hung test should red its shard, not eat the 60-minute job timeout).
      # The two Drift-backed setup_logging cases carry explicit 180-second
      # budgets: bounded stall detection, 3x the longest stall observed on
      # this pool (a 60s budget timed out once under two-shard daytime load,
      # run 43381445516 attempt 2) and 10x tighter than the old 5-minute
      # masks-everything value (#1269). A TimeoutException still names the
      # budget, so a future failure reads as "host stalled 3 minutes", not
      # "feature broken".
      #
      # The shard is an explicit, disjoint file list (not flutter test's
      # --total-shards, which slices by case inside every file and still makes
      # each shard compile the whole suite). split_test_shards.sh round-robins
      # the LC_ALL=C-sorted list, so the four shards partition all files with
      # no overlap — four quarter-compiles instead of four full compiles.
      - name: Split test files for this shard
        run: |
          bash .github/scripts/split_test_shards.sh "${{ matrix.shard-index }}" 4 > shard_files.txt
          count="$(wc -l < shard_files.txt)"
          echo "shard ${{ matrix.shard-index }}/4 owns $count files"
          if [ ! -s shard_files.txt ]; then
            echo "::error::empty shard list; the split and matrix disagree"
            exit 1
          fi

      - name: Flutter test (app, shard ${{ matrix.shard-index }}/4, with coverage)
        run: flutter test $(cat shard_files.txt) --coverage --timeout=5m --concurrency=6

      # Each test file runs in exactly one shard, so a lib file's coverage
      # comes from the shards whose test files exercise it — records overlap
      # only for shared libs. The gates job union-merges these partials (see
      # merge_shard_lcov.sh); renamed per shard so the merge-multiple
      # download cannot collide on lcov.info.
      - name: Stage shard coverage
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            cp coverage/lcov.info "coverage/lcov-shard-${{ matrix.shard-index }}.info"
          else
            echo "::warning::shard produced no coverage; the gates job will fail the baseline"
          fi

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov-shard-${{ matrix.shard-index }}
          path: coverage/lcov-shard-*.info
          if-no-files-found: warn
          retention-days: 1

  # Two path packages (azure_speech, forced_alignment) with suites; the loop
  # stays serial on purpose — both together ran 22s in the 2026-11-13 job, so
  # parallelizing them buys nothing and would only add tester processes to a
  # host whose lane budget the shard matrix already manages.
  path-packages:
    name: Path-package tests
    needs: [changes, analyze]
    if: ${{ !cancelled() && needs.analyze.result == 'success' && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: [self-hosted, Linux, ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Save pub cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Ensure Linux tooling
        run: bash .github/scripts/ensure_linux_tooling.sh --skip-wpe

      - name: Setup Flutter (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          cache: false

      - name: Flutter version probe
        run: flutter --version

      - name: Flutter test (path packages)
        run: |
          set -uo pipefail
          status=0
          for pkg in packages/*/; do
            if [ -d "${pkg}test" ]; then
              (cd "$pkg" && flutter pub get && flutter test --timeout=5m --concurrency=6) || status=1
            fi
          done
          exit "$status"

  # Coverage baseline, codecov and the DST-zone calendar-label case, merged
  # out of the old inline steps: they run whenever the shards have finished
  # (even on a shard failure — the merge uses whatever tracefiles landed and
  # the baseline reports against it), so a flaky shard can no longer skip
  # them silently the way step 15 used to.
  gates:
    name: Coverage & DST gates
    needs: [changes, analyze, test]
    if: ${{ !cancelled() && needs.analyze.result == 'success' && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: [self-hosted, Linux, ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Save pub cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Ensure Linux tooling
        run: bash .github/scripts/ensure_linux_tooling.sh --skip-wpe

      - name: Setup Flutter (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          cache: false

      - name: Flutter version probe
        run: flutter --version

      - name: Flutter pub get
        run: |
          if ! flutter pub get; then
            echo "::warning::Mirror dependency resolution failed; retrying with pub.dev."
            echo "PUB_HOSTED_URL=https://pub.dev" >> "$GITHUB_ENV"
            PUB_HOSTED_URL=https://pub.dev flutter pub get
          fi

      # Same reason as the test job: the DST case below is a root-package
      # flutter test, which builds package:sqlite3's native asset — without
      # the prefetch its no-retry download is a random red on this pool.
      - name: Prefetch sqlite3 Linux native libs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash tool/prefetch_sqlite3_libs.sh linux \
            || echo "::warning::prefetch_sqlite3_libs skipped; the dart_build hook will fetch on its own"

      - name: Download shard coverage
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lcov-shard-*
          merge-multiple: true
          path: coverage/

      - name: Merge shard coverage
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          shards=(coverage/lcov-shard-*.info)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "::error::no shard coverage artifacts landed; cannot evaluate the baseline"
            exit 1
          fi
          bash .github/scripts/merge_shard_lcov.sh coverage/lcov.info "${shards[@]}"

      # The relative-day label counts calendar days, and the 23-hour day a DST
      # transition creates is what breaks that count. The runner's default zone
      # may observe no DST (UTC), where the case skips itself — so run it in a
      # DST zone, and REQUIRE_DST_TIMEZONE turns that skip into a failure so a
      # runner without tzdata cannot silently skip the case.
      - name: Flutter test (calendar labels under a DST timezone)
        if: always()
        env:
          TZ: America/New_York
          REQUIRE_DST_TIMEZONE: '1'
        run: flutter test test/core/presentation/relative_day_label_test.dart --concurrency=6

      - name: Coverage gate (line baseline)
        if: always()
        run: bash .github/scripts/check_coverage_gate.sh coverage/lcov.info

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # The check the main ruleset requires, reported as one name. It carries no
  # work of its own: it succeeds when every job behind it succeeded or was
  # skipped (an irrelevant PR skips the whole chain — a skipped job counts as
  # passing), and fails as soon as any of them failed or was cancelled.
  analyze-test:
    name: Analyze & test
    needs: [analyze, test, path-packages, gates]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Aggregate job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          status=0
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "::error::Analyze & test aggregate: $RESULTS"
              status=1
            fi
          done
          exit "$status"
