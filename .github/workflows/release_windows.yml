name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build Inno Setup installer (EnjoyPlayerSetup-vX.Y.Z.exe)
        type: boolean
        default: true
      publish:
        description: Upload artifacts + update feeds on dl.enjoy.bot
        type: boolean
        default: false
      publish_github:
        description: Upload binaries to the GitHub Release for this tag (draft; finalize via release_publish.yml)
        type: boolean
        default: false

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# FLUTTER_STORAGE_BASE_URL matches build_windows.yml, so a cold Flutter SDK
# (version bump, wiped tool cache) pulls from the CN mirror instead of
# storage.googleapis.com through the WAN proxy.
#
# PUB_HOSTED_URL is deliberately NOT set here (unlike the build workflow): it
# makes pub treat the committed pub.dev lock as a different hosted source and
# re-resolve, rewriting pubspec.lock to mirror URLs and moving versions within
# constraints. A tagged release must build the exact versions pinned in the
# tag's pubspec.lock, so releases resolve against the upstream default source
# instead.
env:
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  release:
    name: Windows release
    runs-on: [self-hosted, windows, flutter]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Short workspace path (Windows MAX_PATH)
        shell: pwsh
        run: .github/scripts/use_short_windows_workdir.ps1

      # Same ATL requirement as build_windows.yml (flutter_secure_storage_windows).
      - name: Ensure VS C++ ATL
        shell: pwsh
        run: .github/scripts/ensure_vs_cpp_atl.ps1

      - uses: ./.github/actions/setup-flutter

      - name: Build Windows release
        shell: pwsh
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        env:
          # Forwarded to flutter build as --dart-define (analytics_config.dart).
          # Unset ⇒ binary ships analytics-inert.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          # Tag pushes have no workflow inputs, and `null != false` is false here,
          # so compare the event explicitly: only workflow_dispatch with
          # build_installer=false skips the installer.
          INPUT_BUILD_INSTALLER: ${{ github.event_name == 'push' || inputs.build_installer != false }}
        run: |
          $gitBash = & .github/scripts/resolve_release_bash.ps1
          $scriptArgs = @('.github/scripts/release_windows.sh')
          # Only skip when explicitly false (empty/null must still build — tag pushes
          # have no inputs, and the GitHub Release upload step expects the .exe).
          if ($env:INPUT_BUILD_INSTALLER -eq 'false') {
            $scriptArgs += '--no-installer'
          }
          & $gitBash @scriptArgs

      - name: Ensure publish tooling
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        run: .github/scripts/ensure_publish_tooling.ps1

      - name: Publish direct-download feeds
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          PUBLISH_BUCKET: ${{ secrets.PUBLISH_BUCKET }}
          PUBLISH_PREFIX: player
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SPARKLE_DSA_PRIV_PEM_BASE64: ${{ secrets.SPARKLE_DSA_PRIV_PEM_BASE64 }}
          RELEASE_REQUIRE_S3: "1"
        run: |
          $gitBash = & .github/scripts/resolve_release_bash.ps1
          & $gitBash .github/scripts/release_windows.sh --publish-only --publish

      # The build ran in the short workspace; read the installer from
      # env.GITHUB_WORKSPACE because github.workspace is the long checkout.
      - name: Upload binaries to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Enjoy Player ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.GITHUB_WORKSPACE }}/build/windows/installer/EnjoyPlayerSetup-${{ github.ref_name }}.exe

      - name: Read pubspec version
        id: read_version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $match) { throw 'Could not read version from pubspec.yaml' }
          "version=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload binaries to GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.read_version.outputs.version }}
          name: Enjoy Player v${{ steps.read_version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.GITHUB_WORKSPACE }}/build/windows/installer/EnjoyPlayerSetup-v${{ steps.read_version.outputs.version }}.exe

      - name: Remove short workspace stage
        if: always()
        shell: pwsh
        run: |
          $baseName = Split-Path -Leaf $env:GITHUB_WORKSPACE
          $shortPath = Join-Path 'C:\e' $baseName
          if (Test-Path $shortPath) { Remove-Item -Path $shortPath -Recurse -Force }
