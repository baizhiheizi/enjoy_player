# enjoy_player · 仓库 manifest（agent 通用描述，vigil F1）
# 2026-11-07 基于实测生成
repo: baizhiheizi/enjoy_player
stack: "flutter / dart（android + ios + linux 桌面）/ l10n 多语言 / fastlane 发布"

commands:
  install: "flutter pub get"
  test: "flutter test"
  lint: "flutter analyze"
  build: "flutter build apk --debug"

review:
  run_tests: false
  test_timeout: 300

review_rubric:
  - id: l10n-hardcode
    text: "用户可见文案必须走 l10n arb，禁止字符串硬编码"
  - id: async-context
    text: "async gap 后使用 BuildContext 必须先检查 mounted"
  - id: widget-const
    text: "可 const 的 widget 与构造必须 const（analyze 零新增告警）"
  - id: platform-channel-safety
    text: "平台通道/原生调用必须有异常处理与降级路径"

gates:
  auto_merge_max_diff_lines: 80
  max_auto_fix_rounds: 3

branch:
  prefix: "feat/"
  labels: ["repo:enjoy_player"]
